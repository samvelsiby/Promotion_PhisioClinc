<!--
  Pro-Motion booking portal step counter.
  Paste everything below this comment into one Custom HTML tag in the Tag Manager
  container GTM-57SHJFTT, trigger "All Pages". Setup steps are in
  docs/google-ads-scaling-clinic-process-juvonno-tracking-2026-11.md, section 10.

  What it sends to www.promotionphysiotherapy.ca/api/portal-event:
    step     open | service | datetime | submit | complete
    channel  paid | site | other
    campaign the utm_campaign value from the ad link, if any
  Nothing else. It never reads form fields, never sends the page address, sets no
  cookie and keeps no ad click id. It keeps the three labels above in the tab's
  session storage so each step is counted once.

  The "complete" step fires when the page shows DONE_PHRASE. That sentence must
  be in Juvonno's "Public Book Thank You Message" and "Secure Book Thank You
  Message" exactly as written here.

  Written in ES5 on purpose: Tag Manager's Custom HTML editor rejects newer syntax.
-->
<script>
(function () {
  try {
    var ENDPOINT = 'https://www.promotionphysiotherapy.ca/api/portal-event';
    var SITE_HOST = 'promotionphysiotherapy.ca';
    var DONE_PHRASE = 'Your appointment request has been received.';
    var KEY = 'pm_portal';
    var onBooking = location.pathname.indexOf('/portal/publicbook.php') === 0;

    var state = {};
    try { state = JSON.parse(sessionStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
    if (!state.sent) state.sent = {};
    function save() { try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

    // Outside the booking pages the tag only finishes a booking already in progress.
    if (!onBooking && !(state.sent.submit && !state.sent.complete)) return;

    function param(name) {
      var match = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
      if (!match) return '';
      try { return decodeURIComponent(match[1].replace(/\+/g, ' ')); } catch (e) { return ''; }
    }

    // Decide the channel once, on the first portal page of this tab.
    if (!state.channel) {
      var medium = param('utm_medium').toLowerCase();
      var adClick = param('gclid') || param('gbraid') || param('wbraid') || param('msclkid');
      var referrerHost = '';
      try { referrerHost = document.referrer ? document.referrer.split('/')[2] || '' : ''; } catch (e) {}
      var fromSite = referrerHost === SITE_HOST || referrerHost.slice(-(SITE_HOST.length + 1)) === '.' + SITE_HOST;
      state.channel = (medium === 'cpc' || medium === 'ppc' || medium === 'paid' || adClick) ? 'paid' : (fromSite ? 'site' : 'other');
      var campaign = param('utm_campaign');
      state.campaign = /^[A-Za-z0-9_.-]{1,60}$/.test(campaign) ? campaign : '';
      save();
    }

    function send(step) {
      if (state.sent[step]) return;
      state.sent[step] = 1;
      save();
      var url = ENDPOINT + '?step=' + step + '&channel=' + state.channel +
        (state.campaign ? '&campaign=' + encodeURIComponent(state.campaign) : '');
      try {
        if (navigator.sendBeacon && navigator.sendBeacon(url)) return;
      } catch (e) {}
      new Image().src = url;
    }

    function checkComplete() {
      if (state.sent.complete) return true;
      var text = document.body ? (document.body.innerText || document.body.textContent || '') : '';
      if (text.indexOf(DONE_PHRASE) === -1) return false;
      send('complete');
      return true;
    }

    function watchForComplete() {
      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        if (checkComplete() || tries >= 90) clearInterval(timer);
      }, 1000);
    }

    if (onBooking) {
      send('open');
      var step = param('step');
      if (step === 'clinicPractService') send('service');
      if (step === 'dateTime') send('datetime');

      // Juvonno submits the booking form through jQuery after its own checks pass,
      // which does not raise the browser's submit event, so listen both ways.
      var onSubmit = function () { send('submit'); watchForComplete(); };
      var form = document.getElementById('frmConfirmAppt');
      if (form) {
        if (window.j && window.j.fn && window.j.fn.on) window.j(form).on('submit', onSubmit);
        form.addEventListener('submit', onSubmit, true);
      }
    }

    // The page that follows a submitted booking, wherever Juvonno shows it.
    if (state.sent.submit && !checkComplete()) watchForComplete();
  } catch (e) { /* The counter must never break a booking. */ }
})();
</script>
